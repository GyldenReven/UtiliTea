<!DOCTYPE html>
<html lang="fr">
    <head>
        <title>Traducteur Morse</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" href="images/logo.png" />
        <link rel="stylesheet" type="text/css" href="style.css" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap"
            rel="stylesheet"
        />
    </head>
    <body>
        <nav>
            <menu class="navBar" id="topnav">
                <a href="index.html">
                    <img
                        src="images/logo.png"
                        alt="Logo UtiliTea"
                        class="logo"
                    />
                    <h1 class="title">UtiliTea</h1>
                </a>
                <!-- Logo du site -->
                <li>
                    <a href="index.html" class="navItem">Accueil</a>
                </li>
                <li>
                    <a href="morsetrad.html" class="navItem selected">
                        Traducteur Morse
                    </a>
                </li>
                <li>
                    <a href="./ceasar.html" class="navItem"> Code César </a>
                </li>
                <li>
                    <a href="./converter.html" class="navItem">
                        Convertisseur de base
                    </a>
                </li>
                <button class="options" onclick="showOptions()">
                    <img
                        id="options-icon"
                        src="images/list-down.png"
                        alt="Options"
                    />
                </button>
            </menu>
        </nav>
        <div class="container">
            <div class="textZone">
                <h1 class="mainTitle">Traducteur Morse</h1>
                <div class="traductor">
                    <textarea
                        name=""
                        id="inputText"
                        placeholder="texte en lettres"
                        rows="6"
                        cols="50"
                    ></textarea>
                    <textarea
                        name=""
                        id="inputMorse"
                        placeholder="texte en morse"
                        rows="6"
                        cols="50"
                    ></textarea>
                    <div id="outputError"></div>
                    <div>
                        <div>
                            charactère court :
                            <textarea
                                name=""
                                id="inputPoint"
                                placeholder="."
                                class="charSelector"
                                maxlength="1"
                            ></textarea>
                        </div>
                        <div>
                            charactère long :
                            <textarea
                                name=""
                                id="inputBar"
                                placeholder="-"
                                class="charSelector"
                                maxlength="1"
                            ></textarea>
                        </div>
                        <div>
                            séparateur de lettre :
                            <textarea
                                name=""
                                id="inputSpace"
                                placeholder=" "
                                class="charSelector"
                                maxlength="1"
                            ></textarea>
                        </div>
                        <div>
                            séparateur de mot :
                            <textarea
                                name=""
                                id="inputSlash"
                                placeholder="/"
                                class="charSelector"
                                maxlength="1"
                            ></textarea>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
<script src="./scripts/morsetrad.js"></script>
<script src="./scripts/showOptions.js"></script>
